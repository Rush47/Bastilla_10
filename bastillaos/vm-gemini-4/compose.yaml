# Legacy container metadata only. Provisioning and guest launch are disabled.
# Existing containers can still be inspected by container_name.
services:
  vm-gemini-4:
    container_name: vm_gemini_4
    image: debian:13-slim
    pull_policy: never
    profiles: [manual-vm]
    entrypoint: ["/bin/false"]
    restart: "no"
    init: true
    user: "${VM_UID:-1000}:${VM_GID:-1000}"
    mem_limit: 2560m
    cpus: 2
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=32m
    ports:
      - "127.0.0.1:2224:2222"
    volumes:
      - ./data:/data:ro
